<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SONICFIELD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --white:   #f5f2ec;
  --black:   #0c0c0c;
  --acid:    #c8ff00;
  --red:     #ff2d20;
  --heard:   #c8ff00;
  --dim:     #888;
  --mid:     #333;
  --border:  rgba(12,12,12,0.12);
  --grotesk: 'Space Grotesk', sans-serif;
  --serif:   'Playfair Display', serif;
  --strip-h: 40px;
  --ease: 140ms cubic-bezier(0.22,1,0.36,1);
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--white);color:var(--black);font-family:var(--grotesk);-webkit-font-smoothing:antialiased}

/* ── APP SHELL ── */
#app{position:fixed;inset:0;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ── LAYER SYSTEM ── */
.layer{position:absolute;inset:0;background:var(--white);display:flex;flex-direction:column;will-change:clip-path}
.layer.entering{animation:reveal var(--ease) forwards}
.layer.leaving{animation:hide var(--ease) forwards}
@keyframes reveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0% 0 0 0)}}
@keyframes hide{from{clip-path:inset(0% 0 0 0)}to{clip-path:inset(0% 0 100% 0)}}
@media(prefers-reduced-motion:reduce){.layer.entering,.layer.leaving{animation:none!important}}

#layer-host{position:absolute;inset:0}

/* ── STRIPS (ancestor path as tape markers) ── */
.strips{position:absolute;top:0;left:0;right:0;z-index:200;pointer-events:none}
.strip{
  height:var(--strip-h);
  display:flex;align-items:center;
  padding:0 20px;
  cursor:pointer;pointer-events:all;
  font-family:var(--grotesk);font-size:11px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--black);
  border-bottom:2px solid var(--black);
  gap:12px;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background var(--ease);
  position:relative;
}
.strip:hover{background:var(--acid)}
.strip:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.strip-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-arrow{font-size:14px;opacity:0.5}
/* strip background colors cycling */
.strip[data-depth="0"]{background:var(--white)}
.strip[data-depth="1"]{background:#e8e4dc}
.strip[data-depth="2"]{background:#ddd8cf}
.strip[data-depth="3"]{background:#d2cdc4}

/* ── LAYER CONTENT ── */
.layer-content{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER ── */
.layer-header{
  flex-shrink:0;
  padding:28px 32px 20px;
  border-bottom:2px solid var(--black);
  position:relative;z-index:10;background:var(--white);
}
.genre-eyebrow{
  font-family:var(--grotesk);font-size:10px;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;
}
.layer-header h1{
  font-family:var(--grotesk);font-weight:700;
  font-size:clamp(22px,3.5vw,42px);
  letter-spacing:-0.03em;line-height:1;
  color:var(--black);
}
.layer-note{
  margin-top:8px;font-family:var(--serif);font-size:14px;font-style:italic;
  color:var(--mid);line-height:1.45;max-width:640px;
}
.layer-meta{
  margin-top:10px;display:flex;gap:20px;flex-wrap:wrap;
  font-family:var(--grotesk);font-size:11px;font-weight:500;letter-spacing:0.04em;
  color:var(--dim);
}
.layer-meta .heard-ct{color:var(--black);background:var(--acid);padding:1px 6px;border-radius:2px;font-weight:700}

/* ── SEARCH ── */
.search-container{
  flex-shrink:0;padding:12px 32px;
  border-bottom:1px solid var(--border);background:var(--white);
}
.search-wrap{position:relative;max-width:480px}
.search-wrap input{
  width:100%;background:transparent;
  border:none;border-bottom:2px solid var(--black);
  color:var(--black);font-family:var(--grotesk);font-size:14px;font-weight:500;
  padding:6px 32px 6px 0;outline:none;
  transition:border-color var(--ease);
  border-radius:0;
}
.search-wrap input::placeholder{color:var(--dim)}
.search-wrap input:focus{border-bottom-color:var(--red)}
.search-clear{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:18px;line-height:1;padding:2px 4px;display:none;
}
.search-clear.visible{display:block}
.search-clear:hover{color:var(--black)}

/* ── SCROLL AREA ── */
.scroll-viewport{
  flex:1;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.scroll-viewport::-webkit-scrollbar{width:3px}
.scroll-viewport::-webkit-scrollbar-track{background:transparent}
.scroll-viewport::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:2px}

/* ── GENRE GRID (root) ── */
.genre-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));
  border-top:1px solid var(--border);
}
.genre-cell{
  padding:24px 28px 20px;
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  cursor:pointer;transition:background var(--ease);
  display:flex;flex-direction:column;gap:8px;
  min-height:120px;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.genre-cell::after{
  content:'→';position:absolute;right:20px;top:24px;
  font-size:18px;color:var(--border);transition:color var(--ease),right var(--ease);
}
.genre-cell:hover{background:#f0ece4}
.genre-cell:hover::after{color:var(--black);right:16px}
.genre-cell:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--red)}
.gc-name{font-family:var(--grotesk);font-size:16px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:var(--black)}
.gc-counts{font-family:var(--grotesk);font-size:11px;color:var(--dim);font-weight:500}
.gc-bar{height:3px;background:rgba(0,0,0,0.08);border-radius:2px;overflow:hidden;margin-top:auto}
.gc-bar-fill{height:100%;background:var(--acid);border-radius:2px;transition:width 0.5s}

/* ── SUBCAT LIST (genre layer) ── */
.subcat-list{border-top:1px solid var(--border)}
.subcat-item{
  padding:20px 32px;border-bottom:1px solid var(--border);
  cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;
  transition:background var(--ease);
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.subcat-item:hover{background:#f0ece4}
.subcat-item:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--red)}
.si-name{font-family:var(--grotesk);font-size:17px;font-weight:600;letter-spacing:-0.02em;color:var(--black);line-height:1.25}
.si-note{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--mid);margin-top:5px;line-height:1.4;max-width:600px}
.si-right{text-align:right;flex-shrink:0}
.si-count{font-family:var(--grotesk);font-size:22px;font-weight:700;color:var(--black);letter-spacing:-0.04em;line-height:1}
.si-heard{font-family:var(--grotesk);font-size:10px;color:var(--dim);font-weight:600;margin-top:3px;letter-spacing:0.04em}
.si-arrow{position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:20px;color:rgba(0,0,0,0.1);transition:color var(--ease),right var(--ease)}
.subcat-item:hover .si-arrow{color:var(--black);right:24px}

/* ── ALBUM LIST (subcat layer — virtualised) ── */
.album-virtual-wrap{position:relative}

.album-row{
  position:absolute;left:0;right:0;
  display:grid;grid-template-columns:80px 1fr 72px;
  align-items:stretch;
  border-bottom:1px solid var(--border);
  transition:background var(--ease);
  cursor:default;
}
.album-row:hover{background:#f0ece4}
.album-row.heard{background:#f8f7f2}

/* Art column */
.album-art{
  width:80px;height:100%;
  flex-shrink:0;background:#e8e4dc;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.album-art img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.3s;position:absolute;inset:0}
.album-art img.loaded{opacity:1}
.album-art-fallback{
  font-family:var(--grotesk);font-size:13px;font-weight:700;
  color:rgba(0,0,0,0.2);letter-spacing:-0.03em;
}
.heard-toggle{
  position:absolute;inset:0;background:transparent;border:none;
  cursor:pointer;z-index:2;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.heard-toggle::before{
  content:'';position:absolute;inset:0;
  background:rgba(200,255,0,0);transition:background 0.15s;
}
.album-row:hover .heard-toggle::before{background:rgba(200,255,0,0.25)}
.album-row.heard .album-art{background:#e8f0d0}
.album-row.heard .heard-toggle::before{background:rgba(200,255,0,0.18)}
.ht-icon{
  position:relative;z-index:3;
  font-size:20px;line-height:1;
  opacity:0;transition:opacity 0.15s;
  color:var(--black);
}
.album-row:hover .ht-icon{opacity:0.7}
.album-row.heard .ht-icon{opacity:1;color:var(--black)}
.heard-toggle:focus-visible{outline:2px solid var(--red)}

/* Info column */
.album-info{
  padding:0 20px;
  display:flex;flex-direction:column;justify-content:center;
  min-width:0;
}
.ai-title{
  font-family:var(--serif);font-size:15px;font-weight:400;font-style:italic;
  color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;
  transition:color var(--ease);
}
.album-row.heard .ai-title{
  color:var(--dim);
  text-decoration:line-through;text-decoration-color:var(--acid);text-decoration-thickness:2px;
}
.ai-artist{
  font-family:var(--grotesk);font-size:11px;font-weight:600;
  color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;letter-spacing:0.02em;
}

/* Year column */
.album-right{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  padding:0 20px 0 0;flex-shrink:0;gap:4px;
}
.album-year{
  font-family:var(--grotesk);font-size:13px;font-weight:700;
  color:rgba(0,0,0,0.2);letter-spacing:-0.02em;
}
.album-row:hover .album-year{color:var(--black)}
.apple-link{
  font-family:var(--grotesk);font-size:10px;font-weight:700;
  color:var(--dim);text-decoration:none;letter-spacing:0.06em;text-transform:uppercase;
  opacity:0;transition:opacity 0.15s;
  padding:2px 5px;border:1px solid var(--border);border-radius:2px;
}
.album-row:hover .apple-link{opacity:1}
.apple-link:hover{background:var(--black);color:var(--white);border-color:var(--black)}
.apple-link:focus-visible{opacity:1;outline:1px solid var(--red)}

/* ── SEARCH OVERLAY ── */
#search-overlay{
  position:absolute;inset:0;background:var(--white);
  z-index:1000;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity 140ms;
}
#search-overlay.active{opacity:1;pointer-events:all}
.search-results-header{
  padding:14px 32px;font-family:var(--grotesk);font-size:11px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--border);flex-shrink:0;
}
.search-results-scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.search-results-scroll::-webkit-scrollbar{width:3px}
.search-results-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1)}

.search-result-row{
  display:grid;grid-template-columns:1fr auto;gap:16px;
  padding:14px 32px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background var(--ease);
}
.search-result-row:hover,.search-result-row:focus-visible{background:#f0ece4;outline:none}
.sr-title{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--black);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-artist{font-family:var(--grotesk);font-size:11px;font-weight:600;color:var(--dim);
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.02em}
.sr-right{text-align:right;flex-shrink:0}
.sr-cat{font-family:var(--grotesk);font-size:10px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:0.06em;
  max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-year{font-family:var(--grotesk);font-size:12px;font-weight:700;color:rgba(0,0,0,0.25);
  margin-top:2px;letter-spacing:-0.02em}
.search-result-row.heard .sr-title{color:var(--dim);text-decoration:line-through;
  text-decoration-color:var(--acid);text-decoration-thickness:2px}

.no-results{padding:48px 32px;font-family:var(--grotesk);font-size:13px;color:var(--dim);font-weight:500}

/* ── UNPARSED NOTICE ── */
#unparsed-notice{
  position:fixed;bottom:16px;right:16px;
  background:var(--red);color:var(--white);
  font-family:var(--grotesk);font-size:11px;font-weight:700;
  padding:10px 16px;border-radius:2px;max-width:320px;
  z-index:9999;display:none;letter-spacing:0.02em;
}
#unparsed-notice.visible{display:block}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .layer-header{padding:20px 20px 14px}
  .genre-grid{grid-template-columns:1fr 1fr}
  .genre-cell{padding:16px 18px 14px;min-height:90px}
  .subcat-item{padding:16px 20px}
  .si-arrow{display:none}
  .search-container{padding:10px 20px}
  .album-row{grid-template-columns:60px 1fr 56px}
  .album-art{width:60px}
  .album-info{padding:0 12px}
  .album-right{padding:0 12px 0 0}
  .album-year{font-size:11px}
  .search-result-row{padding:12px 20px}
  .search-results-header{padding:12px 20px}
}
@media(min-width:1400px){
  .genre-grid{grid-template-columns:repeat(4,1fr)}
  .album-row{grid-template-columns:88px 1fr 80px}
  .album-art{width:88px}
}

:focus:not(:focus-visible){outline:none}
</style>
</head>
<body>
<div id="app">
  <div class="strips" id="strips" role="navigation" aria-label="Navigation path"></div>
  <div id="layer-host" style="position:absolute;inset:0"></div>
  <div id="search-overlay" role="region" aria-live="polite" aria-label="Search results">
    <div class="search-results-header" id="search-results-header">Search</div>
    <div class="search-results-scroll" id="search-results-list"></div>
  </div>
  <div id="unparsed-notice" role="alert"></div>
</div>

<script>
const NS='sf2';
const store={
  get(k,d){try{const v=localStorage.getItem(NS+':'+k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(NS+':'+k,JSON.stringify(v))}catch{}}
};

let heardSet=new Set(store.get('heard',[]));
function saveHeard(){store.set('heard',[...heardSet])}
function isHeard(id){return heardSet.has(id)}
function toggleHeard(id){
  if(heardSet.has(id))heardSet.delete(id);else heardSet.add(id);
  saveHeard();refreshHeardDisplays(id);
}

let taxonomy=[];
let allAlbums=[];
let unparsedLines=[];
const artCache={};
const artInFlight={};

async function parseAlbums(){
  let text='',ok=false;
  for(const p of['./albums.md','../albums.md']){
    try{const r=await fetch(p);if(r.ok){text=await r.text();ok=true;break}}catch{}
  }
  if(!ok){showUnparsed(['Could not fetch albums.md']);return}

  const lines=text.split('\n');
  const genreMap={};
  let currentGenre=null,currentSubcat=null;

  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line||line==='SONICFIELD LIST')continue;

    if(!line.startsWith('- ')&&/^[A-Z]/.test(line)){
      const dashIdx=line.indexOf(' — ');
      let genreName,subcatName,note;
      if(dashIdx!==-1){
        genreName=line.slice(0,dashIdx).trim();
        const rest=line.slice(dashIdx+3).trim();
        const pi=rest.indexOf(' (');
        if(pi!==-1){subcatName=rest.slice(0,pi).trim();note=rest.slice(pi+2,-1).trim()}
        else{subcatName=rest;note=''}
      }else{
        const pi=line.indexOf(' (');
        if(pi!==-1){genreName=line.slice(0,pi).trim();note=line.slice(pi+2,-1).trim();subcatName=genreName}
        else{genreName=line;subcatName='';note=''}
      }
      if(!genreMap[genreName]){genreMap[genreName]={name:genreName,subcats:[]};taxonomy.push(genreMap[genreName])}
      currentGenre=genreMap[genreName];
      if(subcatName&&subcatName!==genreName){
        currentSubcat={name:subcatName,note,albums:[],genreName};
        currentGenre.subcats.push(currentSubcat);
      }else{
        currentSubcat={name:note||genreName,note:'',albums:[],genreName};
        currentGenre.subcats.push(currentSubcat);
      }
      continue;
    }

    const m=line.match(/^-\s+\[( |x)\]\s+(.+?)\s+\((\d{4})\)\s+—\s+(.+)$/);
    if(m){
      const id=allAlbums.length;
      const album={id,title:m[2].trim(),year:parseInt(m[3]),artist:m[4].trim(),subcatRef:currentSubcat};
      allAlbums.push(album);
      if(currentSubcat)currentSubcat.albums.push(album);
      else unparsedLines.push('no-cat:'+line);
      continue;
    }
    unparsedLines.push('line '+(i+1)+': '+line);
  }
  if(unparsedLines.length)showUnparsed(unparsedLines);
}

function showUnparsed(lines){
  const el=document.getElementById('unparsed-notice');
  el.textContent=`⚠ ${lines.length} unparsed: ${lines.slice(0,2).join('; ')}`;
  el.classList.add('visible');
}

function fetchArt(artist,title,cb){
  const key=`${artist}|${title}`;
  if(artCache[key]!==undefined){cb(artCache[key]);return}
  if(artInFlight[key]){artInFlight[key].push(cb);return}
  artInFlight[key]=[cb];
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist+' '+title)}&entity=album&limit=1`)
    .then(r=>r.json())
    .then(d=>{
      const res=d.results&&d.results[0];
      const url=res?res.artworkUrl100.replace('100x100','300x300'):null;
      artCache[key]=url;
      const cbs=artInFlight[key];delete artInFlight[key];
      cbs.forEach(fn=>fn(url));
    })
    .catch(()=>{
      artCache[key]=null;
      const cbs=artInFlight[key]||[];delete artInFlight[key];
      cbs.forEach(fn=>fn(null));
    });
}

/* ── LAYERS ── */
let layerStack=[];
const layerHost=document.getElementById('layer-host');
const stripsEl=document.getElementById('strips');

function rowHeight(){return window.innerWidth<600?60:(window.innerWidth>=1400?88:80)}

function stripColors(){return['var(--white)','#f0ece4','#e8e3da','#e0dbd1']}

function renderStrips(){
  stripsEl.innerHTML='';
  for(let i=0;i<layerStack.length-1;i++){
    const layer=layerStack[i];
    const s=document.createElement('button');
    s.className='strip';
    s.setAttribute('tabindex','0');
    s.setAttribute('data-depth',i);
    s.setAttribute('aria-label','Back to: '+layerLabel(layer));
    s.style.background=stripColors()[i]||'var(--white)';
    s.innerHTML=`<span class="strip-label">${layerLabel(layer)}</span><span class="strip-arrow">↑</span>`;
    const d=i;
    s.addEventListener('click',()=>popToDepth(d));
    s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();popToDepth(d)}});
    stripsEl.appendChild(s);
  }
  layerHost.style.top=((layerStack.length-1)*40)+'px';
}

function layerLabel(l){
  if(l.type==='root')return'SONICFIELD';
  if(l.type==='genre')return taxonomy[l.genreIdx].name;
  if(l.type==='subcat'){return taxonomy[l.genreIdx].subcats[l.subcatIdx].name}
  return'';
}

function pushLayer(cfg,animate=true){
  const el=buildLayerEl(cfg);
  layerStack.push({...cfg,element:el});
  layerHost.appendChild(el);
  renderStrips();
  if(animate){
    el.classList.add('entering');
    el.addEventListener('animationend',()=>el.classList.remove('entering'),{once:true});
  }
  persistNav();
}

function popLayer(animate=true){
  if(layerStack.length<=1)return;
  const top=layerStack.pop();
  renderStrips();
  if(animate){
    top.element.classList.add('leaving');
    top.element.addEventListener('animationend',()=>top.element.remove(),{once:true});
  }else top.element.remove();
  persistNav();
}

function popToDepth(d){
  while(layerStack.length-1>d)popLayer(layerStack.length-1===d+1);
}

function persistNav(){
  store.set('navStack',layerStack.map(l=>({type:l.type,genreIdx:l.genreIdx,subcatIdx:l.subcatIdx})));
}

/* ── BUILD LAYERS ── */
function buildLayerEl(cfg){
  const div=document.createElement('div');
  div.className='layer';
  if(cfg.type==='root')div.appendChild(buildRoot());
  else if(cfg.type==='genre')div.appendChild(buildGenre(cfg.genreIdx));
  else if(cfg.type==='subcat')div.appendChild(buildSubcat(cfg.genreIdx,cfg.subcatIdx));
  return div;
}

function buildSearchBar(){
  const c=document.createElement('div');
  c.className='search-container';
  c.innerHTML=`<div class="search-wrap"><input type="search" placeholder="Search albums, artists…" aria-label="Search collection" autocomplete="off" spellcheck="false"><button class="search-clear" aria-label="Clear search">×</button></div>`;
  const inp=c.querySelector('input');
  const clr=c.querySelector('.search-clear');
  inp.value=searchQuery;
  if(searchQuery)clr.classList.add('visible');
  inp.addEventListener('input',()=>{
    clr.classList.toggle('visible',inp.value.trim().length>0);
    clearTimeout(searchDebounce);
    searchDebounce=setTimeout(()=>{
      document.querySelectorAll('.search-container input').forEach(el=>{if(el!==inp)el.value=inp.value});
      setSearch(inp.value.trim().toLowerCase());
    },80);
  });
  clr.addEventListener('click',()=>{inp.value='';clr.classList.remove('visible');setSearch('')});
  inp.addEventListener('keydown',e=>{if(e.key==='Escape'){clr.click();inp.blur()}});
  return c;
}

/* ROOT */
function buildRoot(){
  const w=document.createElement('div');w.className='layer-content';
  const totalHeard=allAlbums.filter(a=>isHeard(a.id)).length;
  const h=document.createElement('div');h.className='layer-header';
  h.innerHTML=`<h1>SONICFIELD</h1><p class="layer-note">A complete taxonomy of recorded sound — ${allAlbums.length} albums across ${taxonomy.length} genres.</p><div class="layer-meta"><span>${allAlbums.length} albums</span><span class="heard-ct">${totalHeard} heard</span></div>`;
  w.appendChild(h);
  w.appendChild(buildSearchBar());
  const vp=document.createElement('div');vp.className='scroll-viewport';
  const grid=document.createElement('div');grid.className='genre-grid';grid.setAttribute('role','list');
  taxonomy.forEach((genre,gi)=>{
    const tot=genre.subcats.reduce((s,sc)=>s+sc.albums.length,0);
    const hd=genre.subcats.reduce((s,sc)=>s+sc.albums.filter(a=>isHeard(a.id)).length,0);
    const pct=tot>0?(hd/tot*100).toFixed(0):0;
    const cell=document.createElement('div');
    cell.className='genre-cell';cell.setAttribute('tabindex','0');cell.setAttribute('role','button');
    cell.setAttribute('aria-label',`${genre.name}, ${tot} albums`);
    cell.innerHTML=`<div class="gc-name">${genre.name}</div><div class="gc-counts">${genre.subcats.length} subcategories · ${tot} albums</div><div class="gc-bar"><div class="gc-bar-fill" style="width:${pct}%"></div></div>`;
    cell.addEventListener('click',()=>pushLayer({type:'genre',genreIdx:gi}));
    cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cell.click()}});
    grid.appendChild(cell);
  });
  vp.appendChild(grid);w.appendChild(vp);
  return w;
}

/* GENRE */
function buildGenre(gi){
  const genre=taxonomy[gi];
  const w=document.createElement('div');w.className='layer-content';
  const tot=genre.subcats.reduce((s,sc)=>s+sc.albums.length,0);
  const hd=genre.subcats.reduce((s,sc)=>s+sc.albums.filter(a=>isHeard(a.id)).length,0);
  const h=document.createElement('div');h.className='layer-header';
  h.innerHTML=`<h1>${genre.name}</h1><div class="layer-meta"><span>${genre.subcats.length} subcategories</span><span>${tot} albums</span><span class="heard-ct">${hd} heard</span></div>`;
  w.appendChild(h);w.appendChild(buildSearchBar());
  const vp=document.createElement('div');vp.className='scroll-viewport';
  const list=document.createElement('div');list.className='subcat-list';list.setAttribute('role','list');
  genre.subcats.forEach((sc,sci)=>{
    const hd2=sc.albums.filter(a=>isHeard(a.id)).length;
    const item=document.createElement('div');
    item.className='subcat-item';item.setAttribute('tabindex','0');item.setAttribute('role','button');
    item.setAttribute('aria-label',`${sc.name}, ${sc.albums.length} albums`);
    item.innerHTML=`<div><div class="si-name">${sc.name}</div>${sc.note?`<div class="si-note">${sc.note}</div>`:''}</div><div class="si-right"><div class="si-count">${sc.albums.length}</div><div class="si-heard">${hd2} heard</div></div><span class="si-arrow" aria-hidden="true">→</span>`;
    item.addEventListener('click',()=>pushLayer({type:'subcat',genreIdx:gi,subcatIdx:sci}));
    item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}});
    list.appendChild(item);
  });
  vp.appendChild(list);w.appendChild(vp);
  return w;
}

/* SUBCAT — virtualised */
function buildSubcat(gi,sci){
  const genre=taxonomy[gi];const sc=genre.subcats[sci];
  const w=document.createElement('div');w.className='layer-content';
  const hd=sc.albums.filter(a=>isHeard(a.id)).length;
  const header=document.createElement('div');header.className='layer-header';
  header.innerHTML=`<div class="genre-eyebrow">${genre.name}</div><h1>${sc.name}</h1>${sc.note?`<p class="layer-note">${sc.note}</p>`:''}<div class="layer-meta"><span>${sc.albums.length} albums</span><span class="heard-ct">${hd} heard</span></div>`;
  w.appendChild(header);w.appendChild(buildSearchBar());

  const vp=document.createElement('div');vp.className='scroll-viewport';
  vp.setAttribute('role','list');vp.setAttribute('aria-label',sc.name+' albums');

  const vWrap=document.createElement('div');vWrap.className='album-virtual-wrap';
  const rendered={};

  function update(){
    const rH=rowHeight();
    vWrap.style.height=(sc.albums.length*rH)+'px';
    const top=vp.scrollTop,h2=vp.clientHeight;
    const buf=6;
    const start=Math.max(0,Math.floor(top/rH)-buf);
    const end=Math.min(sc.albums.length-1,Math.ceil((top+h2)/rH)+buf);
    for(const k in rendered){
      const ki=parseInt(k);
      if(ki<start||ki>end){rendered[k].remove();delete rendered[k]}
    }
    for(let i=start;i<=end;i++){
      if(rendered[i]){rendered[i].style.top=(i*rH)+'px';rendered[i].style.height=rH+'px';continue}
      const row=buildAlbumRow(sc.albums[i],rH);
      row.style.top=(i*rH)+'px';row.style.height=rH+'px';
      vWrap.appendChild(row);rendered[i]=row;
    }
  }

  vp.addEventListener('scroll',update,{passive:true});
  const saved=store.get(`sc:${gi}:${sci}`,0);
  vp.scrollTop=saved;
  vp.addEventListener('scroll',()=>store.set(`sc:${gi}:${sci}`,vp.scrollTop),{passive:true});
  new ResizeObserver(update).observe(vp);
  vp.appendChild(vWrap);w.appendChild(vp);
  requestAnimationFrame(update);
  return w;
}

function buildAlbumRow(album,rH){
  const heard=isHeard(album.id);
  const row=document.createElement('div');
  row.className='album-row'+(heard?' heard':'');
  row.setAttribute('data-album-id',album.id);

  /* art */
  const art=document.createElement('div');art.className='album-art';
  const fb=document.createElement('div');fb.className='album-art-fallback';fb.textContent=album.year;
  art.appendChild(fb);
  const img=document.createElement('img');img.alt='';img.loading='lazy';art.appendChild(img);
  fetchArt(album.artist,album.title,url=>{if(url){img.src=url;img.onload=()=>img.classList.add('loaded')}});
  const btn=document.createElement('button');btn.className='heard-toggle';
  btn.setAttribute('aria-label',`Mark ${album.title} as ${heard?'unheard':'heard'}`);
  btn.setAttribute('aria-pressed',heard?'true':'false');
  btn.innerHTML=`<span class="ht-icon" aria-hidden="true">${heard?'✦':'✦'}</span>`;
  btn.addEventListener('click',e=>{
    e.stopPropagation();toggleHeard(album.id);
    const n=isHeard(album.id);
    row.classList.toggle('heard',n);
    btn.setAttribute('aria-pressed',n?'true':'false');
  });
  art.appendChild(btn);row.appendChild(art);

  /* info */
  const info=document.createElement('div');info.className='album-info';
  info.innerHTML=`<div class="ai-title">${esc(album.title)}</div><div class="ai-artist">${esc(album.artist)}</div>`;
  row.appendChild(info);

  /* right */
  const right=document.createElement('div');right.className='album-right';
  right.innerHTML=`<span class="album-year">${album.year}</span><a class="apple-link" href="https://music.apple.com/search?term=${encodeURIComponent(album.artist+' '+album.title)}" target="_blank" rel="noopener" aria-label="Apple Music">▶︎</a>`;
  row.appendChild(right);
  return row;
}

function refreshHeardDisplays(id){
  document.querySelectorAll(`[data-album-id="${id}"]`).forEach(row=>{
    const h=isHeard(id);
    row.classList.toggle('heard',h);
    const btn=row.querySelector('.heard-toggle');
    if(btn)btn.setAttribute('aria-pressed',h?'true':'false');
  });
}

/* ── SEARCH ── */
let searchQuery='';
let searchDebounce=null;

function setSearch(q){
  searchQuery=q;
  const ov=document.getElementById('search-overlay');
  if(!q){ov.classList.remove('active');return}
  ov.classList.add('active');
  renderSearchResults(q);
}

function renderSearchResults(q){
  const hdr=document.getElementById('search-results-header');
  const list=document.getElementById('search-results-list');
  const results=allAlbums.filter(a=>
    a.title.toLowerCase().includes(q)||
    a.artist.toLowerCase().includes(q)||
    String(a.year).includes(q)||
    (a.subcatRef&&(a.subcatRef.name.toLowerCase().includes(q)||a.subcatRef.genreName.toLowerCase().includes(q)))
  );
  hdr.textContent=`${results.length} result${results.length!==1?'s':''} for "${q}"`;
  list.innerHTML='';
  if(!results.length){list.innerHTML='<div class="no-results">Nothing found.</div>';return}
  const shown=results.slice(0,200);
  const frag=document.createDocumentFragment();
  shown.forEach(album=>{
    const h=isHeard(album.id);
    const row=document.createElement('div');
    row.className='search-result-row'+(h?' heard':'');
    row.setAttribute('tabindex','0');row.setAttribute('role','button');
    const cat=album.subcatRef?(album.subcatRef.genreName!==album.subcatRef.name?`${shorten(album.subcatRef.genreName)} / ${album.subcatRef.name}`:album.subcatRef.name):'';
    row.innerHTML=`<div><div class="sr-title">${hi(esc(album.title),q)}</div><div class="sr-artist">${hi(esc(album.artist),q)}</div></div><div class="sr-right"><div class="sr-cat">${esc(cat)}</div><div class="sr-year">${album.year}</div></div>`;
    row.addEventListener('click',()=>navToAlbum(album));
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navToAlbum(album)}});
    frag.appendChild(row);
  });
  list.appendChild(frag);
  if(results.length>200){const m=document.createElement('div');m.className='no-results';m.textContent=`…and ${results.length-200} more. Refine your search.`;list.appendChild(m)}
}

function hi(html,q){
  if(!q)return html;
  const e=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return html.replace(new RegExp(`(${e})`,'gi'),'<mark style="background:rgba(200,255,0,0.5);color:inherit;border-radius:1px">$1</mark>');
}

function navToAlbum(album){
  if(!album.subcatRef)return;
  const sc=album.subcatRef;
  const gi=taxonomy.findIndex(g=>g.name===sc.genreName);
  if(gi===-1)return;
  const si=taxonomy[gi].subcats.indexOf(sc);
  if(si===-1)return;
  setSearch('');
  document.querySelectorAll('.search-container input').forEach(el=>el.value='');
  while(layerStack.length>1)popLayer(false);
  pushLayer({type:'genre',genreIdx:gi},false);
  pushLayer({type:'subcat',genreIdx:gi,subcatIdx:si},true);
  requestAnimationFrame(()=>{
    const idx=sc.albums.indexOf(album);
    if(idx===-1)return;
    const vp=layerStack[layerStack.length-1].element.querySelector('.scroll-viewport');
    if(vp)vp.scrollTop=idx*rowHeight();
  });
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(searchQuery){setSearch('');document.querySelectorAll('.search-container input').forEach(el=>el.value='')}
    else if(layerStack.length>1)popLayer();
  }
  if(e.key==='Backspace'&&document.activeElement.tagName!=='INPUT'&&layerStack.length>1){e.preventDefault();popLayer()}
});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shorten(s){return s.length>20?s.slice(0,18)+'…':s}

async function boot(){
  await parseAlbums();
  if(!taxonomy.length){document.getElementById('layer-host').innerHTML='<div style="padding:40px;font-family:monospace;color:red">Failed to parse albums.md</div>';return}
  pushLayer({type:'root'},false);
  const saved=store.get('navStack',[]);
  for(let i=1;i<saved.length;i++){
    const s=saved[i];
    if(s.type==='genre'&&taxonomy[s.genreIdx])pushLayer({type:'genre',genreIdx:s.genreIdx},false);
    else if(s.type==='subcat'&&taxonomy[s.genreIdx]&&taxonomy[s.genreIdx].subcats[s.subcatIdx])
      pushLayer({type:'subcat',genreIdx:s.genreIdx,subcatIdx:s.subcatIdx},false);
  }
}
boot();
</script>
